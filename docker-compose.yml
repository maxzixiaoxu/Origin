# Distributed job queue -- local stack.
#
# Services are added phase by phase; this file currently brings up the data
# layer and applies migrations, which is everything the broker needs to run
# against. `make up` waits for health checks, so migrations never race an
# unready Postgres.
#
# HOST PORTS: every published port defaults into a 5xxxx block rather than the
# conventional 5432/6379/3000. Developer machines very often already have a
# Postgres or Redis on the default port, and silently binding over one -- or
# failing to start with a port-in-use error -- is a bad first-run experience.
# Container-internal ports stay conventional; only the host side is remapped.
# Override any of these via the environment or a .env file (see .env.example).

name: jobq

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobq
      POSTGRES_PASSWORD: jobq
      POSTGRES_DB: jobq
      # Postgres defaults to a locale-aware collation that makes text
      # comparisons noticeably slower and is irrelevant for the ASCII
      # identifiers used here.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    command:
      - postgres
      # Modest tuning so benchmark numbers reflect the queue design rather than
      # Postgres running with 128MB of shared buffers.
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=8MB
      # Surface slow queries during load tests instead of guessing.
      - -c
      - log_min_duration_statement=500
    ports:
      - "${JOBQ_POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobq -d jobq"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      # AOF makes a restart warm rather than empty. Correctness does NOT depend
      # on it: Redis is a rebuildable cache here and the reconciler replays
      # state from Postgres on boot. This is a speed optimisation, not a
      # durability guarantee, and the system is tested with FLUSHALL to keep
      # that claim honest.
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - ""
      # The single most important line in this file.
      #
      # Under an eviction policy, Redis silently drops keys when it hits
      # maxmemory -- and the keys it drops would be ready sets and lease sets,
      # i.e. jobs disappearing from the hot path with no error anywhere. With
      # noeviction, writes fail loudly instead, the enqueue returns an error,
      # and the caller finds out. A visible failure beats invisible job loss.
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
    ports:
      - "${JOBQ_REDIS_PORT:-56379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s

  # S3-compatible object storage for image originals and their derivatives.
  #
  # Workers use the real AWS SDK against this, so the storage code is genuine S3
  # code and would move to actual S3 with a config change. Chosen over a shared
  # Docker volume because a volume assumes every worker sees the same
  # filesystem -- the assumption a distributed system should not make.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: jobq
      MINIO_ROOT_PASSWORD: jobq-secret
    ports:
      # 9000 is the S3 API; 9001 is the web console, useful for eyeballing
      # derivatives during a demo.
      - "${JOBQ_MINIO_PORT:-59000}:9000"
      - "${JOBQ_MINIO_CONSOLE_PORT:-59001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  # One-shot migration runner. Go owns the schema; Rails never migrates.
  migrate:
    image: migrate/migrate:v4.18.1
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path
      - /migrations
      - -database
      - postgres://jobq:jobq@postgres:5432/jobq?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  # --- application services ---

  queued:
    build:
      context: .
      dockerfile: deploy/go.Dockerfile
      args:
        CMD_PATH: services/queue/cmd/queued
    environment:
      POSTGRES_URL: postgres://jobq:jobq@postgres:5432/jobq?sslmode=disable
      REDIS_ADDR: redis:6379
      GRPC_ADDR: ":9090"
      HTTP_ADDR: ":8080"
      LOG_LEVEL: info
      PROMOTE_INTERVAL: 1s
      REAP_INTERVAL: 2s
    ports:
      - "${JOBQ_QUEUE_GRPC_PORT:-59090}:9090"
      - "${JOBQ_QUEUE_HTTP_PORT:-58080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  workerd:
    build:
      context: .
      dockerfile: deploy/go.Dockerfile
      args:
        CMD_PATH: services/worker/cmd/workerd
    environment:
      QUEUE_ADDR: queued:9090
      WORKER_QUEUES: images,default
      WORKER_CONCURRENCY: 8
      WORKER_FETCH_BATCH: 4
      METRICS_ADDR: ":9101"
      LOG_LEVEL: info
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: jobq
      S3_ACCESS_KEY: jobq
      S3_SECRET_KEY: jobq-secret
      S3_PATH_STYLE: "true"
      # Presigned URLs are signed over the host header, so a URL built for
      # "minio:9000" cannot simply be rewritten for the browser afterwards --
      # the signature would no longer match. The public endpoint is passed
      # separately so presigning uses an address a browser can actually reach.
      S3_PUBLIC_ENDPOINT: http://localhost:${JOBQ_MINIO_PORT:-59000}
    depends_on:
      queued:
        condition: service_started
      minio:
        condition: service_healthy
    # Scale with: docker compose up -d --scale workerd=3
    # No published ports, so replicas do not collide on the host.
    deploy:
      replicas: 3
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: deploy/rails.Dockerfile
    environment:
      DATABASE_URL: postgres://jobq:jobq@postgres:5432/jobq
      QUEUE_API_URL: http://queued:8080
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: jobq
      S3_ACCESS_KEY: jobq
      S3_SECRET_KEY: jobq-secret
      # Presigned URLs are signed over the host header, so they must be signed
      # against an address the BROWSER can reach -- not the compose-internal one
      # Rails itself uses. Rewriting the URL afterwards would break the
      # signature.
      S3_PUBLIC_ENDPOINT: http://localhost:${JOBQ_MINIO_PORT:-59000}
      RAILS_ENV: development
      RAILS_MAX_THREADS: 5
    ports:
      - "${JOBQ_ADMIN_PORT:-53000}:3000"
    volumes:
      # Mounted for live reload during development. Gems live in a named volume
      # so the host directory does not need a bundle path and re-bundling
      # survives container restarts.
      - ./services/admin:/app
      - adminbundle:/usr/local/bundle
    depends_on:
      postgres:
        condition: service_healthy
      queued:
        condition: service_started
      minio:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
  adminbundle:
