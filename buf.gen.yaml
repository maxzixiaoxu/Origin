version: v2

# Generated stubs land in gen/ and are committed. Committing generated code is
# a deliberate tradeoff: it means anyone can clone and `go build` with no
# codegen toolchain installed, and it makes contract changes visible in review
# as concrete diffs. The cost is remembering to run `make proto` after editing
# a .proto -- `make proto-check` fails the build if the two ever drift.
clean: true

plugins:
  - local: protoc-gen-go
    out: gen
    opt: paths=source_relative

  - local: protoc-gen-go-grpc
    out: gen
    opt:
      - paths=source_relative
      - require_unimplemented_servers=true
