# Connection to the Go-owned database.
#
# There are no Rails migrations and no schema.rb -- the db/ directory has been
# deleted on purpose. The schema lives in migrations/ at the repository root and
# is applied by golang-migrate; Rails connects to the result and reads it
# through models that refuse writes.
#
# Sharing a database between two services is normally an anti-pattern. It is
# defensible here only because the ownership rule is absolute and enforced in
# code rather than by convention: Go is the sole writer, and every model
# overrides `readonly?` to true. See docs/design-decisions.md.

default: &default
  adapter: postgresql
  encoding: unicode
  # Sized to Puma's thread count. A pool smaller than the thread count produces
  # intermittent checkout timeouts under load, which surface as random slowness
  # rather than as an obvious configuration error.
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  # The dashboard only reads, so a slow query can only hurt the person waiting
  # for the page -- but it also holds a connection the whole time. Failing fast
  # keeps one pathological filter from starving the pool.
  variables:
    statement_timeout: 15000

development:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL", "postgres://jobq:jobq@localhost:55432/jobq") %>

# Prepared by running golang-migrate against it, not by Rails.
test:
  <<: *default
  url: <%= ENV.fetch("TEST_DATABASE_URL", "postgres://jobq:jobq@localhost:55432/jobq_test") %>

production:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL") %>
